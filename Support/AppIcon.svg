<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="0.55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecf5"/>
    </linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b1026" flood-opacity="0.35"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.3" markerHeight="2.3" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/>
    </marker>
    <marker id="head2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.3" markerHeight="2.3" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- macOS icon grid: 824pt body inset 100pt, continuous-corner squircle -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <g transform="translate(-30 0)">
  <!-- back clipboard (the other machine) -->
  <g transform="rotate(-9 420 540)" opacity="0.38">
    <rect x="250" y="270" width="330" height="430" rx="42" fill="#ffffff"/>
  </g>

  <!-- front clipboard -->
  <g filter="url(#soft)">
    <rect x="390" y="300" width="370" height="480" rx="46" fill="url(#paper)"/>
  </g>
  <!-- clip -->
  <g filter="url(#soft)">
    <rect x="490" y="262" width="170" height="86" rx="26" fill="url(#clip)"/>
    <rect x="540" y="282" width="70" height="26" rx="13" fill="#334155" opacity="0.55"/>
  </g>

  <!-- sync arrows -->
  <g fill="none" stroke-width="34" stroke-linecap="round">
    <path d="M 485 545 A 92 92 0 0 1 640 470" stroke="#6366f1" marker-end="url(#head2)"/>
    <path d="M 665 590 A 92 92 0 0 1 510 665" stroke="#0891b2" marker-end="url(#head)"/>
  </g>
</g>
</svg>
